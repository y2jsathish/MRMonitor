apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "svc.name" . }}
  {{- if .Values.keyVault.clientId }}
  annotations: { azure.workload.identity/client-id: {{ .Values.keyVault.clientId | quote }} }
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata: { name: {{ include "svc.name" . }}-config }
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "svc.name" . }}
  labels: {{- include "svc.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: {{ include "svc.name" . }} }
  ports: [{ name: http, port: 80, targetPort: http }]
