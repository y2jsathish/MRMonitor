{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: { name: {{ include "svc.name" . }}-kv }
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.keyVault.clientId | quote }}
    keyvaultName: {{ required "keyVault.name is required" .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.keyVault.objects }}
        - objectName: {{ .name }}
          objectType: secret
          {{- if .alias }}
          objectAlias: {{ .alias }}
          {{- end }}
        {{- end }}
  secretObjects:
    - secretName: {{ include "svc.name" . }}-secrets
      type: Opaque
      data:
        {{- range .Values.keyVault.objects }}
        - { objectName: {{ .name }}, key: {{ .name }} }
        {{- end }}
{{- end }}
