# Local development stack:  docker compose -f deployment/docker/docker-compose.dev.yml up -d
# Then:  psql postgresql://atmnexus:atmnexus@localhost:5432/atmnexus -f db/migrations/V001__core_schema.sql
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: atmnexus, POSTGRES_PASSWORD: atmnexus, POSTGRES_DB: atmnexus }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U atmnexus"], interval: 5s, retries: 10 }

  kafka:
    image: apache/kafka:3.8.0           # KRaft single node
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
    ports: ["9200:9200"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel.yaml"]
    volumes: ["../observability/otel-collector.yaml:/etc/otel.yaml:ro"]
    ports: ["4317:4317", "8889:8889"]

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes: ["../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]

  device-service:
    build: { context: ../.., dockerfile: deployment/docker/Dockerfile.dev-device }
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=atmnexus;Username=atmnexus;Password=atmnexus"
      Kafka__BootstrapServers: kafka:9092
      Auth__Authority: http://localhost:8081          # point at your dev IdP (Keycloak/Duende demo)
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["5080:8080"]

volumes: { pgdata: {} }
