name: ci

on:
  pull_request:
  push:
    branches: [main, 'release/**']
    tags: ['v*']

permissions:
  contents: read
  id-token: write        # OIDC to Azure (no stored cloud secrets)
  security-events: write # code scanning upload

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REGISTRY: atmnexus.azurecr.io

jobs:
  build-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: atmnexus, POSTGRES_PASSWORD: atmnexus, POSTGRES_DB: atmnexus }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atmnexus" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }        # GitVersion needs history
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - name: Restore (locked)
        run: |
          dotnet new sln -n AtmNexus --force
          dotnet sln AtmNexus.sln add $(find src tests -name '*.csproj')
          dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror:CS8602,CS8604,CS8618
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore --severity warn
      - name: "Migrate database (schema must apply cleanly to an empty PostgreSQL 16)"
        run: psql "postgresql://atmnexus:atmnexus@localhost:5432/atmnexus" -v ON_ERROR_STOP=1 -f db/migrations/V001__core_schema.sql
        env: { PGCONNECT_TIMEOUT: 10 }
      - name: Test
        run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Vulnerable / deprecated packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: TestResults }

  codeql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: csharp, queries: security-extended }
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: |
          for p in $(find src -name '*.csproj'); do dotnet build "$p" -c Release; done
      - uses: github/codeql-action/analyze@v3

  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (CLI, no license needed)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --verbose

  agent-package:
    needs: build-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - name: "Publish agent (32-bit: msxfs.dll is x86 on ATMs)"
        shell: pwsh
        run: |
          dotnet publish src/Agent/AtmNexus.Agent/AtmNexus.Agent.csproj -c Release -r win-x86 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out/agent
      - name: Sign binaries (Azure Trusted Signing)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          endpoint: https://weu.codesigning.azure.net/
          trusted-signing-account-name: atmnexus-signing
          certificate-profile-name: atmnexus-agent
          files-folder: out/agent
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - run: Compress-Archive -Path out/agent/* -DestinationPath out/AtmNexus.Agent-${{ github.sha }}.zip
      - uses: actions/upload-artifact@v4
        with: { name: agent-package, path: out/*.zip }

  images:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [Device]          # extend as services are added: Monitoring, Incident, Alert, Deployment, Reporting, Notification, Audit, Auth
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name atmnexus
      - name: Compute version
        id: v
        run: echo "version=$(git describe --tags --always --match 'v*' | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      - name: Build & push
        run: |
          deployment/docker/build-image.sh ${{ matrix.service }} ${{ steps.v.outputs.version }} $REGISTRY
          docker push $REGISTRY/atmnexus/$(echo ${{ matrix.service }} | tr A-Z a-z)-service:${{ steps.v.outputs.version }}
      - name: "Scan image (fail on HIGH/CRITICAL with a fix available)"
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/atmnexus/${{ matrix.service == 'Device' && 'device' || matrix.service }}-service:${{ steps.v.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: SBOM + provenance
        uses: anchore/sbom-action@v0
        with: { image: "${{ env.REGISTRY }}/atmnexus/device-service:${{ steps.v.outputs.version }}", format: spdx-json }
